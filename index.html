<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI认证问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            height: 6px;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: #4CAF50;
            height: 100%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 40px;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #333;
            white-space: pre-line;
        }

        .answers-container {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            line-height: 1.4;
        }

        .answer-option:hover {
            background: #e3f2fd;
            border-color: #2196F3;
            transform: translateY(-2px);
        }

        .answer-option.selected {
            background: #2196F3;
            border-color: #2196F3;
            color: white;
        }

        .answer-option.correct {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .answer-option.incorrect {
            background: #f44336;
            border-color: #f44336;
            color: white;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .next-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .next-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .result {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        .result.incorrect {
            border-left-color: #f44336;
        }

        .explanation {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }

        .explanation h4 {
            color: #2196F3;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .start-screen {
            text-align: center;
            padding: 40px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .mode-selection {
            margin: 30px 0;
        }

        .mode-selection h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .mode-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .mode-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .mode-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .mode-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mode-desc {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .wrong-questions-input {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
        }

        .wrong-questions-input h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .wrong-questions-input p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .wrong-questions-input textarea {
            width: 100%;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            font-family: inherit;
            font-size: 0.95em;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }

        .wrong-questions-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .secondary-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .secondary-btn:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .hidden {
            display: none;
        }

        .question-navigator {
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #e9ecef;
            cursor: pointer;
            font-weight: bold;
            color: #495057;
            transition: all 0.3s ease;
            user-select: none;
            border-radius: 10px 10px 0 0;
            position: relative;
        }

        .nav-header:hover {
            background: #dee2e6;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-header:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .nav-toggle {
            font-size: 1.2em;
            color: #495057;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .nav-toggle.rotated {
            transform: rotate(180deg);
        }

        .nav-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }

        .nav-item {
            width: 60px;
            height: 50px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s ease;
            background: white;
        }

        .nav-item:hover {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .nav-item.current {
            border-color: #2196F3;
            background: #2196F3;
            color: white;
        }

        .nav-item.answered {
            border-color: #4CAF50;
            background: #4CAF50;
            color: white;
        }

        .nav-item.answered.incorrect {
            border-color: #f44336;
            background: #f44336;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .question-text {
                font-size: 1em;
            }

            .answer-option {
                padding: 12px 15px;
            }

            .mode-options {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .mode-btn {
                padding: 15px;
            }

            .wrong-questions-input {
                padding: 20px;
            }

            .input-actions {
                flex-direction: column;
            }

            .secondary-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI认证问答系统</h1>
            <p>测试你的AI知识，提升专业技能</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="content">
            <!-- 开始界面 -->
            <div id="startScreen" class="start-screen">
                <h2>欢迎来到AI认证问答系统</h2>
                <p>本系统包含多个AI相关的专业问题，帮助你测试和提升AI知识水平。</p>
                <p>每个问题都有详细的解释，帮助你更好地理解相关概念。</p>
                
                <div class="mode-selection">
                    <h3>选择题库：</h3>
                    <div class="mode-options">
                        <button class="mode-btn active" onclick="selectQuestionBank('AIF.json')" id="aifBankBtn">
                            <span class="mode-icon">🤖</span>
                            <span class="mode-title">AI认证题库</span>
                            <span class="mode-desc">AI相关专业问题</span>
                        </button>
                        <button class="mode-btn" onclick="selectQuestionBank('SAA-C03.json')" id="saaBankBtn">
                            <span class="mode-icon">☁️</span>
                            <span class="mode-title">AWS SAA-C03</span>
                            <span class="mode-desc">AWS解决方案架构师</span>
                        </button>
                        <button class="mode-btn" onclick="selectQuestionBank('SAP-C02.json')" id="sapBankBtn">
                            <span class="mode-icon">🏗️</span>
                            <span class="mode-title">AWS SAP-C02</span>
                            <span class="mode-desc">AWS专业级架构师</span>
                        </button>
                    </div>
                </div>

                <div class="mode-selection">
                    <h3>选择答题模式：</h3>
                    <div class="mode-options">
                        <button class="mode-btn active" onclick="selectMode('all')" id="allModeBtn">
                            <span class="mode-icon">📚</span>
                            <span class="mode-title">全部题目</span>
                            <span class="mode-desc">练习所有题目</span>
                        </button>
                        <button class="mode-btn" onclick="selectMode('wrong')" id="wrongModeBtn">
                            <span class="mode-icon">❌</span>
                            <span class="mode-title">错题练习</span>
                            <span class="mode-desc">只练习错题</span>
                        </button>
                    </div>
                </div>

                <div id="wrongQuestionsInput" class="wrong-questions-input hidden">
                    <h3>输入错题列表</h3>
                    <p>请输入错题ID，每行一个（例如：Question 1, Question 5, Question 10）</p>
                    <textarea id="wrongQuestionsText" placeholder="Question 1&#10;Question 5&#10;Question 10" rows="6"></textarea>
                    <div class="input-actions">
                        <button class="secondary-btn" onclick="loadSampleWrongQuestions()">加载示例</button>
                        <button class="secondary-btn" onclick="clearWrongQuestions()">清空</button>
                    </div>
                </div>

                <button class="start-btn" onclick="startQuiz()">开始答题</button>
                <button class="secondary-btn" onclick="clearAllProgress()" style="margin-top: 15px;">清除答题记录</button>
            </div>

            <!-- 问题界面 -->
            <div id="questionScreen" class="hidden">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="currentQuestion">1</div>
                        <div class="stat-label">当前题目</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="totalQuestions">0</div>
                        <div class="stat-label">总题目数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="correctAnswers">0</div>
                        <div class="stat-label">正确</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="incorrectAnswers">0</div>
                        <div class="stat-label">错误</div>
                    </div>
                </div>

                <div class="question-navigator">
                    <div class="nav-header" onclick="toggleNavigator()">
                        <span>题目导航</span>
                        <span class="nav-toggle">▼</span>
                    </div>
                    <div class="nav-content hidden" id="navContent">
                        <div class="nav-grid" id="navGrid"></div>
                    </div>
                </div>

                <div class="question-container">
                    <div class="question-number" id="questionNumber"></div>
                    <div class="question-text" id="questionText"></div>
                    <div class="answers-container" id="answersContainer"></div>
                </div>

                <button class="submit-btn" id="submitBtn" onclick="submitAnswer()" disabled>提交答案</button>
                <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>

                <div class="result hidden" id="result"></div>
                <div class="explanation hidden" id="explanation"></div>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let filteredQuestions = []; // 筛选后的题目
        let currentQuestionIndex = 0;
        let selectedAnswers = []; // 改为数组支持多选
        let answered = false;
        let correctCount = 0;
        let incorrectCount = 0;
        let answeredQuestions = new Set(); // 记录已答题目
        let questionResults = new Map(); // 记录题目结果
        let currentMode = 'all'; // 当前模式：'all' 或 'wrong'
        let currentQuestionBank = 'AIF.json'; // 当前题库：'AIF.json' 或 'SAA-C03.json'
        
        // 获取当前存储键名
        function getStorageKey(dataType) {
            const bankName = currentQuestionBank.replace('.json', '');
            const modeName = currentMode;
            return `${bankName}_${modeName}_${dataType}`;
        }

        // localStorage 键名类型
        const STORAGE_KEY_TYPES = {
            QUESTION_BANK: 'questionBank',
            MODE: 'mode',
            ANSWERED_QUESTIONS: 'answeredQuestions',
            QUESTION_RESULTS: 'questionResults',
            CORRECT_COUNT: 'correctCount',
            INCORRECT_COUNT: 'incorrectCount',
            CURRENT_INDEX: 'currentIndex',
            FILTERED_QUESTIONS: 'filteredQuestions'
        };

        // 加载问题数据
        async function loadQuestions() {
            try {
                const response = await fetch(currentQuestionBank);
                questions = await response.json();
                document.getElementById('totalQuestions').textContent = questions.length;
            } catch (error) {
                console.error('加载问题失败:', error);
                alert(`加载问题数据失败，请检查${currentQuestionBank}文件是否存在。`);
            }
        }

        // 保存答题记录到localStorage
        function saveProgress() {
            try {
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.QUESTION_BANK), currentQuestionBank);
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.MODE), currentMode);
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.CORRECT_COUNT), correctCount.toString());
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.INCORRECT_COUNT), incorrectCount.toString());
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.CURRENT_INDEX), currentQuestionIndex.toString());
                
                // 保存已答题目集合
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.ANSWERED_QUESTIONS), JSON.stringify(Array.from(answeredQuestions)));
                
                // 保存题目结果
                const resultsObj = {};
                questionResults.forEach((value, key) => {
                    resultsObj[key] = value;
                });
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.QUESTION_RESULTS), JSON.stringify(resultsObj));
                
                // 保存筛选后的题目ID列表
                const filteredIds = filteredQuestions.map(q => q.id);
                localStorage.setItem(getStorageKey(STORAGE_KEY_TYPES.FILTERED_QUESTIONS), JSON.stringify(filteredIds));
                
            } catch (error) {
                console.error('保存进度失败:', error);
            }
        }

        // 从localStorage加载答题记录
        function loadProgress() {
            try {
                // 首先尝试加载题库选择（从AIF的存储中获取，因为这是默认值）
                const savedQuestionBank = localStorage.getItem('AIF_all_questionBank');
                if (savedQuestionBank) {
                    currentQuestionBank = savedQuestionBank;
                }
                
                // 尝试加载模式选择（从AIF的存储中获取，因为这是默认值）
                const savedMode = localStorage.getItem('AIF_all_mode');
                if (savedMode) {
                    currentMode = savedMode;
                }
                
                // 加载统计
                const savedCorrect = localStorage.getItem(getStorageKey(STORAGE_KEY_TYPES.CORRECT_COUNT));
                if (savedCorrect) {
                    correctCount = parseInt(savedCorrect);
                }
                
                const savedIncorrect = localStorage.getItem(getStorageKey(STORAGE_KEY_TYPES.INCORRECT_COUNT));
                if (savedIncorrect) {
                    incorrectCount = parseInt(savedIncorrect);
                }
                
                // 加载已答题目
                const savedAnswered = localStorage.getItem(getStorageKey(STORAGE_KEY_TYPES.ANSWERED_QUESTIONS));
                if (savedAnswered) {
                    answeredQuestions = new Set(JSON.parse(savedAnswered));
                }
                
                // 加载题目结果
                const savedResults = localStorage.getItem(getStorageKey(STORAGE_KEY_TYPES.QUESTION_RESULTS));
                if (savedResults) {
                    const resultsObj = JSON.parse(savedResults);
                    questionResults = new Map();
                    Object.keys(resultsObj).forEach(key => {
                        questionResults.set(parseInt(key), resultsObj[key]);
                    });
                }
                
                // 加载当前题目索引
                const savedIndex = localStorage.getItem(getStorageKey(STORAGE_KEY_TYPES.CURRENT_INDEX));
                if (savedIndex) {
                    currentQuestionIndex = parseInt(savedIndex);
                }
                
            } catch (error) {
                console.error('加载进度失败:', error);
            }
        }

        // 清除localStorage中的答题记录
        function clearProgress() {
            try {
                Object.values(STORAGE_KEY_TYPES).forEach(keyType => {
                    localStorage.removeItem(getStorageKey(keyType));
                });
            } catch (error) {
                console.error('清除进度失败:', error);
            }
        }

        // 根据localStorage更新UI显示
        function updateUIFromStorage() {
            // 更新题库选择按钮
            document.getElementById('aifBankBtn').classList.toggle('active', currentQuestionBank === 'AIF.json');
            document.getElementById('saaBankBtn').classList.toggle('active', currentQuestionBank === 'SAA-C03.json');
            document.getElementById('sapBankBtn').classList.toggle('active', currentQuestionBank === 'SAP-C02.json');
            
            // 更新模式选择按钮
            document.getElementById('allModeBtn').classList.toggle('active', currentMode === 'all');
            document.getElementById('wrongModeBtn').classList.toggle('active', currentMode === 'wrong');
            
            // 显示/隐藏错题输入框
            const wrongQuestionsInput = document.getElementById('wrongQuestionsInput');
            wrongQuestionsInput.classList.toggle('hidden', currentMode === 'all');
        }

        // 清除所有答题记录
        function clearAllProgress() {
            if (confirm('确定要清除所有题库和模式的答题记录吗？此操作不可恢复。')) {
                // 清除所有可能的存储键
                const banks = ['AIF', 'SAA-C03', 'SAP-C02'];
                const modes = ['all', 'wrong'];
                const keyTypes = Object.values(STORAGE_KEY_TYPES);
                
                banks.forEach(bank => {
                    modes.forEach(mode => {
                        keyTypes.forEach(keyType => {
                            const key = `${bank}_${mode}_${keyType}`;
                            localStorage.removeItem(key);
                        });
                    });
                });
                
                // 重置状态
                currentQuestionIndex = 0;
                correctCount = 0;
                incorrectCount = 0;
                answeredQuestions.clear();
                questionResults.clear();
                filteredQuestions = [];
                
                alert('所有答题记录已清除！');
            }
        }

        // 选择题库
        async function selectQuestionBank(questionBank) {
            currentQuestionBank = questionBank;
            
            // 更新按钮状态
            document.getElementById('aifBankBtn').classList.toggle('active', questionBank === 'AIF.json');
            document.getElementById('saaBankBtn').classList.toggle('active', questionBank === 'SAA-C03.json');
            document.getElementById('sapBankBtn').classList.toggle('active', questionBank === 'SAP-C02.json');
            
            // 保存题库选择到localStorage
            localStorage.setItem('AIF_all_questionBank', questionBank);
            
            // 重新加载问题数据
            await loadQuestions();
            
            // 重置状态（但不清除localStorage，因为现在是分离存储）
            currentQuestionIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            answeredQuestions.clear();
            questionResults.clear();
            filteredQuestions = [];
            
            // 更新统计显示
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('currentQuestion').textContent = '1';
            document.getElementById('correctAnswers').textContent = '0';
            document.getElementById('incorrectAnswers').textContent = '0';
        }

        // 选择模式
        function selectMode(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            document.getElementById('allModeBtn').classList.toggle('active', mode === 'all');
            document.getElementById('wrongModeBtn').classList.toggle('active', mode === 'wrong');
            
            // 显示/隐藏错题输入框
            const wrongQuestionsInput = document.getElementById('wrongQuestionsInput');
            wrongQuestionsInput.classList.toggle('hidden', mode === 'all');
            
            // 保存模式选择到localStorage
            localStorage.setItem('AIF_all_mode', mode);
            
            // 保存模式选择
            saveProgress();
        }

        // 加载示例错题
        function loadSampleWrongQuestions() {
            document.getElementById('wrongQuestionsText').value = 'Question 1\nQuestion 5\nQuestion 10';
        }

        // 清空错题输入
        function clearWrongQuestions() {
            document.getElementById('wrongQuestionsText').value = '';
        }

        // 筛选错题
        function filterWrongQuestions() {
            if (currentMode === 'all') {
                filteredQuestions = [...questions];
                return;
            }

            const wrongQuestionsText = document.getElementById('wrongQuestionsText').value.trim();
            if (!wrongQuestionsText) {
                alert('请输入错题列表！');
                return false;
            }

            const wrongQuestionIds = wrongQuestionsText.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (wrongQuestionIds.length === 0) {
                alert('请输入有效的错题ID！');
                return false;
            }

            // 筛选题目
            filteredQuestions = questions.filter(question => 
                wrongQuestionIds.includes(question.id)
            );

            if (filteredQuestions.length === 0) {
                alert('未找到匹配的题目，请检查错题ID是否正确！');
                return false;
            }

            // 显示筛选结果
            const foundCount = filteredQuestions.length;
            const totalCount = wrongQuestionIds.length;
            alert(`找到 ${foundCount} 道题目（共输入 ${totalCount} 个ID）`);
            
            return true;
        }

        // 开始答题
        function startQuiz() {
            if (currentMode === 'wrong') {
                if (!filterWrongQuestions()) {
                    return;
                }
            } else {
                filteredQuestions = [...questions];
            }

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            
            // 加载之前的答题记录
            loadProgress();
            
            // 恢复筛选后的题目
            if (filteredQuestions.length === 0) {
                if (currentMode === 'wrong') {
                    if (!filterWrongQuestions()) {
                        return;
                    }
                } else {
                    filteredQuestions = [...questions];
                }
            }
            
            // 更新统计显示
            document.getElementById('correctAnswers').textContent = correctCount;
            document.getElementById('incorrectAnswers').textContent = incorrectCount;
            
            showQuestion();
            createNavigator();
        }

        // 显示当前问题
        function showQuestion() {
            if (currentQuestionIndex >= filteredQuestions.length) {
                showFinalResults();
                return;
            }

            const question = filteredQuestions[currentQuestionIndex];
            document.getElementById('questionNumber').textContent = question.id;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = filteredQuestions.length;

            // 解析答案选项
            const answers = question.answers.split('\n');
            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';

            answers.forEach((answer, index) => {
                const option = document.createElement('div');
                option.className = 'answer-option';
                option.textContent = answer;
                option.onclick = () => selectAnswer(index);
                answersContainer.appendChild(option);
            });

            // 重置状态
            selectedAnswers = [];
            answered = false;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('explanation').classList.add('hidden');

            // 更新进度条和导航器
            updateProgress();
            updateNavigator();
        }

        // 选择答案
        function selectAnswer(index) {
            if (answered) return;

            const question = filteredQuestions[currentQuestionIndex];
            const isMultipleChoice = question.correct_answer.length > 1;
            const options = document.querySelectorAll('.answer-option');

            if (isMultipleChoice) {
                // 多选题：切换选择状态
                const option = options[index];
                if (selectedAnswers.includes(index)) {
                    // 取消选择
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    option.classList.remove('selected');
                } else {
                    // 添加选择
                    selectedAnswers.push(index);
                    option.classList.add('selected');
                }
            } else {
                // 单选题：清除之前的选择，选择当前答案
                options.forEach(option => option.classList.remove('selected'));
                options[index].classList.add('selected');
                selectedAnswers = [index];
            }

            // 启用提交按钮
            document.getElementById('submitBtn').disabled = selectedAnswers.length === 0;
        }

        // 提交答案
        function submitAnswer() {
            if (selectedAnswers.length === 0 || answered) return;

            const question = filteredQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.answer-option');
            const correctAnswerIndices = getCorrectAnswerIndices(question.correct_answer);
            const isCorrect = checkAnswer(selectedAnswers, correctAnswerIndices);

            // 显示结果
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');
            
            if (isCorrect) {
                resultDiv.textContent = '✅ 回答正确！';
                resultDiv.className = 'result';
                correctCount++;
            } else {
                resultDiv.textContent = '❌ 回答错误！';
                resultDiv.className = 'result incorrect';
                incorrectCount++;
            }

            // 显示正确答案
            options.forEach((option, index) => {
                if (correctAnswerIndices.includes(index)) {
                    option.classList.add('correct');
                } else if (selectedAnswers.includes(index) && !isCorrect) {
                    option.classList.add('incorrect');
                }
            });

            // 显示解释
            const explanationDiv = document.getElementById('explanation');
            explanationDiv.classList.remove('hidden');
            explanationDiv.innerHTML = `
                <h4>解释：</h4>
                <p>${question.explanation}</p>
            `;

            // 记录答题结果
            answeredQuestions.add(currentQuestionIndex);
            questionResults.set(currentQuestionIndex, isCorrect);

            // 更新统计
            document.getElementById('correctAnswers').textContent = correctCount;
            document.getElementById('incorrectAnswers').textContent = incorrectCount;

            // 保存答题记录
            saveProgress();

            // 显示下一题按钮
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');

            answered = true;
            
            // 更新导航器
            updateNavigator();
        }

        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;
            saveProgress(); // 保存当前进度
            showQuestion();
        }

        // 获取正确答案的索引数组
        function getCorrectAnswerIndices(correctAnswer) {
            const answerLetters = correctAnswer.trim().split('');
            const answerMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, 'E': 4 };
            return answerLetters.map(letter => answerMap[letter]).filter(index => index !== undefined);
        }

        // 检查答案是否正确
        function checkAnswer(selectedIndices, correctIndices) {
            if (selectedIndices.length !== correctIndices.length) return false;
            return selectedIndices.every(index => correctIndices.includes(index));
        }

        // 创建题目导航器
        function createNavigator() {
            const navGrid = document.getElementById('navGrid');
            navGrid.innerHTML = '';
            
            for (let i = 0; i < filteredQuestions.length; i++) {
                const navItem = document.createElement('div');
                navItem.className = 'nav-item';
                
                // 提取题目ID中的数字
                const questionId = filteredQuestions[i].id;
                const questionNumber = extractQuestionNumber(questionId);
                navItem.textContent = questionNumber;
                
                navItem.onclick = () => jumpToQuestion(i);
                navGrid.appendChild(navItem);
            }
            updateNavigator();
        }

        // 提取题目ID中的数字
        function extractQuestionNumber(questionId) {
            // 匹配 "Question N" 中的数字
            const match = questionId.match(/Question\s+(\d+)/i);
            if (match) {
                return match[1]; // 返回数字部分
            }
            // 如果没有匹配到，返回原始ID
            return questionId;
        }

        // 更新导航器状态
        function updateNavigator() {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach((item, index) => {
                item.classList.remove('current', 'answered', 'incorrect');
                
                if (index === currentQuestionIndex) {
                    item.classList.add('current');
                } else if (answeredQuestions.has(index)) {
                    item.classList.add('answered');
                    if (questionResults.get(index) === false) {
                        item.classList.add('incorrect');
                    }
                }
            });
        }

        // 跳转到指定题目
        function jumpToQuestion(index) {
            if (index < 0 || index >= filteredQuestions.length) return;
            
            // 如果当前题目已选择答案但未提交，提示用户
            if (selectedAnswers.length > 0 && !answered) {
                if (!confirm('当前题目已选择答案但未提交，确定要跳转吗？')) {
                    return;
                }
            }
            
            currentQuestionIndex = index;
            showQuestion();
            updateNavigator();
        }

        // 切换导航器显示/隐藏
        function toggleNavigator() {
            const navContent = document.getElementById('navContent');
            const navToggle = document.querySelector('.nav-toggle');
            
            navContent.classList.toggle('hidden');
            navToggle.classList.toggle('rotated');
        }

        // 更新进度条
        function updateProgress() {
            const progress = (currentQuestionIndex / filteredQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // 显示最终结果
        function showFinalResults() {
            const accuracy = ((correctCount / filteredQuestions.length) * 100).toFixed(1);
            const content = document.querySelector('.content');
            content.innerHTML = `
                <div class="start-screen">
                    <h2>答题完成！</h2>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-number">${filteredQuestions.length}</div>
                            <div class="stat-label">总题目</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">正确</div>
                        </div>
                                                <div class="stat-item">
                            <div class="stat-number">${incorrectCount}</div>
                            <div class="stat-label">错误</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${accuracy}%</div>
                            <div class="stat-label">正确率</div>
                        </div>
                    </div>
                    <p>恭喜你完成了所有题目！</p>
                    <button class="start-btn" onclick="restartQuiz()">重新开始</button>
                </div>
            `;
        }

        // 重新开始
        function restartQuiz() {
            // 回到开始界面
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            
            // 重置状态
            currentQuestionIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            selectedAnswers = [];
            answered = false;
            answeredQuestions.clear();
            questionResults.clear();
            filteredQuestions = [];
            
            // 清除localStorage记录
            clearProgress();
        }

        // 页面加载时加载问题
        window.onload = async function() {
            // 首先加载localStorage中的设置
            loadProgress();
            
            // 然后加载问题数据
            await loadQuestions();
            
            // 更新UI显示
            updateUIFromStorage();
        };
    </script>
</body>
</html>
